name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build with make
        run: |
          make
          arch=$(uname -m)
          mv tspacketchk tspacketchk_${arch}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tspacketchk-${{ matrix.runner }}
          path: tspacketchk_*
  
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts

      - name: Create GitHub Release with individual binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/**/tspacketchk_*
